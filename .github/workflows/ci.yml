name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test (mock model)
        run: python -m ai_productivity_toolkit --mock summarize "hello world"
      - name: Example smoke test (mock model)
        run: python examples/quickstart.py --mock
